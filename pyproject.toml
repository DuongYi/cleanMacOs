[project]
name = "mac-dev-cleaner"
version = "0.3.0"
description = "macOS disk cleaner for Flutter, mobile and AI developers that never breaks ongoing work or forces re-downloads."
authors = [{ name = "Duong Yi" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["macos", "cleaner", "disk", "flutter", "xcode", "android", "gradle", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "psutil>=5.9.0",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/DuongYi/cleanMacOs"
Repository = "https://github.com/DuongYi/cleanMacOs"
Changelog = "https://github.com/DuongYi/cleanMacOs/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mclean = "mclean.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
