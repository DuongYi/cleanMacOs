[project]
name = "mac-dev-cleaner"
version = "0.1.0"
description = "A precision macOS cleaner for Flutter, AI, and Mobile Developers with zero re-download loops."
authors = [{ name = "Developer" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "psutil>=5.9.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mclean = "mclean.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
